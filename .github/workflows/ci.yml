name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Unit tests (no external data)
        run: uv run pytest
      - name: CLI smoke
        run: uv run ml-returns-pred list
