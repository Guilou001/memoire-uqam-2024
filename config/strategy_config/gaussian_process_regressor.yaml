prediction_pipeline:
  estimator_name: "gaussian_process_regressor"
  regressor_dict:
    kernel: null  # default kernel ConstantKernel(1.0, constant_value_bounds="fixed") * RBF(1.0, length_scale_bounds="fixed")
    alpha: 0.000001
    optimizer: "fmin_l_bfgs_b"
    n_restarts_optimizer: 0
    normalize_y: False
    copy_X_train: True
    n_targets: null
    random_state: 42

  bayes_search_params_grid:
    kernel: ["RBF", "DotProduct", "Matern"]  # Example kernel choices
    alpha: "(1e-10, 1e-2)"                   # Range for alpha
    n_restarts_optimizer: "(0, 10)"          # Range for the number of restarts
    normalize_y: [True, False]               # Categorical choice for normalize_y

  grid_search_params_grid:
    kernel: ["RBF", "DotProduct", "Matern"]  # Example kernel choices
    alpha: [1e-10, 1e-5, 1e-2]               # Specific values for alpha
    n_restarts_optimizer: [0, 5, 10]         # Specific values for the number of restarts
    normalize_y: [True, False]               # Categorical choice for normalize_y

analyze_strategy_returns:
  strategy_name: "Gaussian_Process_Regressor"
