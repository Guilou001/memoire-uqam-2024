prediction_pipeline:
  estimator_name: "gradient_boosting_regressor"
  regressor_dict:
    loss: "huber"
    learning_rate: 0.01
    n_estimators: 400
    subsample: 1.0
    criterion: "friedman_mse"
    min_samples_split: 2
    min_samples_leaf: 1
    min_weight_fraction_leaf: 0.0
    max_depth: 14
    min_impurity_decrease: 0.5
    init: null
    random_state: 42
    max_features: null
    alpha: 0.9
    verbose: 0
    max_leaf_nodes: null
    warm_start: False
    validation_fraction: 0.1
    n_iter_no_change: null
    tol: 0.0001
    ccp_alpha: 0.0

  bayes_search_params_grid:
    loss: ["squared_error", "huber"]   # Categorical choice for loss function
    learning_rate: "(0.001, 0.1)"      # Range of learning rates to explore
    n_estimators: "(50, 500)"          # Range of n_estimators to explore
    subsample: "(0.5, 1.0)"            # Range for subsample ratio
    min_samples_split: "(2, 20)"       # Range for min_samples_split
    min_samples_leaf: "(1, 10)"        # Range for min_samples_leaf
    max_depth: "(5, 20)"               # Range for max_depth
    min_impurity_decrease: "(0.0, 0.5)"# Range for min_impurity_decrease
    alpha: "(0.75, 0.99)"              # Range for alpha in the huber loss function
    validation_fraction: "(0.1, 0.3)"  # Range for validation_fraction during training
    tol: "(0.00001, 0.001)"            # Range for tolerance for early stopping
    ccp_alpha: "(0.0, 0.5)"            # Range for complexity parameter for pruning

  grid_search_params_grid:
    loss: ["squared_error", "huber"]
    learning_rate: [0.01]
    n_estimators: [50, 100, 200]
    subsample: [0.5, 1.0]
    min_samples_split: [2]
    min_samples_leaf: [1]
    min_weight_fraction_leaf: [0.0]
    max_depth: [7, 10]
    min_impurity_decrease: [0.2]
    alpha: [0.9]
    validation_fraction: [0.1]
    tol: [0.0001]
    ccp_alpha: [0.2]

analyze_strategy_returns:
  strategy_name: "Gradient_Boosting_Regressor"
