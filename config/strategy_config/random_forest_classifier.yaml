prediction_pipeline:
  estimator_name: "random_forest_classifier"
  regressor_dict:
    bootstrap: True
    ccp_alpha: 0.2
    class_weight: null
    criterion: "gini"
    max_depth: 14
    max_features: "sqrt"
    max_leaf_nodes: null
    max_samples: null
    min_impurity_decrease: 0.0
    min_samples_leaf: 1
    min_samples_split: 2
    min_weight_fraction_leaf: 0.0
    monotonic_cst: null
    n_estimators: 300
    n_jobs: null
    oob_score: False
    random_state: 42
    verbose: 0
    warm_start: False

  bayes_search_params_grid:
    n_estimators: "(50, 500)"         # Range for the number of trees in the forest
    criterion: ["gini", "entropy"]    # Categorical choice for the function to measure the quality of a split
    max_depth: "(5, 20)"              # Range for maximum depth of the tree
    min_samples_split: "(2, 10)"      # Range for the minimum number of samples required to split an internal node
    min_samples_leaf: "(1, 10)"       # Range for the minimum number of samples required to be at a leaf node
    max_features: ["sqrt", "log2"]  # Categorical choice for the number of features to consider when looking for the best split
    bootstrap: [True, False]          # Categorical choice for bootstrap samples when building trees
    ccp_alpha: "(0.0, 0.5)"           # Range for complexity parameter for Minimal Cost-Complexity Pruning

  grid_search_params_grid:
    n_estimators: [50, 100, 200]
    criterion: ["gini", "entropy"]
    max_depth: [7, 10]
    min_samples_split: [2]
    min_samples_leaf: [1]
    max_features: ["log2"]

analyze_strategy_returns:
  strategy_name: "Random_Forest_Classifier"
