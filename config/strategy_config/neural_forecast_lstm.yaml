prediction_pipeline:
  estimator_name: "neural_forecast_lstm"
  estimator_params: {
        "freq": "auto",
        "local_scaler_type": null, # scaler to apply per-series to all features before fitting, which is inverted after predicting
        "futr_exog_list": null, # list of future exogenous variables
        "verbose_fit": True,
        "verbose_predict": True,
        "input_size": -1,
        "inference_input_size": -1, # maximum sequence length for truncated inference default (-1) uses all history
        "encoder_n_layers": 2, # number of layers for the LSTM
        "encoder_hidden_size": 200, # number of hidden units for the LSTM
        "encoder_bias": True, # whether to use bias in the LSTM
        "encoder_dropout": 0.0,
        "context_size": 10,
        "decoder_hidden_size": 200,
        "decoder_layers": 2,
        "loss": null,
        "valid_loss": null,
        "max_steps": 1000,
        "learning_rate": 0.005,
        "num_lr_decays": -1,
        "early_stop_patience_steps": -1,
        "val_check_steps": 100, # number of training steps between every validation loss check
        "batch_size": 32, # number of different series in each batch
        "valid_batch_size": null,
        "scaler_type": "robust",
        "random_seed": 1,
        "num_workers_loader": 0, # workers to be used by TimeSeriesDataLoader
        "drop_last_loader": False,
        "trainer_kwargs": null,
        "optimizer": null,
        "optimizer_kwargs": null,
    }

analyze_strategy_returns:
  strategy_name: "Neural_Forecast_LSTM"