prediction_pipeline:
  estimator_name: "hist_gradient_boosting_classifier"
  regressor_dict:
    loss: "log_loss"
    learning_rate: 0.01
    max_iter: 400
    max_leaf_nodes: 100
    max_depth: null
    min_samples_leaf: 20
    l2_regularization: 0.0
    max_features: 1.0
    max_bins: 255
    categorical_features: "warn"
    monotonic_cst: null
    interaction_cst: null
    warm_start: False
    early_stopping: "auto"
    scoring: "loss"
    validation_fraction: 0.1
    n_iter_no_change: 10
    tol: 0.000001
    verbose: 0
    random_state: 43
    class_weight: null

  bayes_search_params_grid:
    learning_rate: "(0.001, 0.1)"    # Range of learning rates to explore
    max_iter: "(50, 500)"            # Range for the number of boosting iterations
    max_leaf_nodes: "(31, 127)"      # Range for the maximum number of leaves in each tree
    max_features: "(0.5, 1.0)"       # Range for the maximum number of features considered at each split
    min_samples_leaf: "(10, 50)"     # Range for the minimum number of samples in each leaf
    l2_regularization: "(0.0, 1.0)"  # Range for L2 regularization
    warm_start: [True, False]        # Categorical choice for warm start

  grid_search_params_grid:
    learning_rate: [0.01]
    max_iter: [50, 100, 200]
    max_leaf_nodes: [31, 63, 127]
    max_features: [0.5, 1.0]
    warm_start: [True]

analyze_strategy_returns:
  strategy_name: "Hist_Gradient_Boosting_Classifier"
