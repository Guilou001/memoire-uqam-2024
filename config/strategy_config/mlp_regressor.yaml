prediction_pipeline:
  estimator_name: "mlp_regressor"
  regressor_dict:
    hidden_layer_sizes: (10,)
    activation: "relu"
    solver: "adam"
    alpha: 0.0001
    batch_size: "auto"
    learning_rate: "constant"
    learning_rate_init: 0.001
    power_t: 0.5
    max_iter: 500
    shuffle: True
    random_state: 42
    tol: 0.0001
    verbose: False
    warm_start: False
    momentum: 0.9
    nesterovs_momentum: True
    early_stopping: False
    validation_fraction: 0.1
    beta_1: 0.9
    beta_2: 0.999
    epsilon: 0.00000001
    n_iter_no_change: 10
    max_fun: 15000

  bayes_search_params_grid:
    hidden_layer_sizes: "(50, 150)"    # Tuple specifying the range for the number of neurons in each hidden layer
    activation: ["identity", "logistic", "tanh", "relu"]  # Categorical choice for activation function
    solver: ["lbfgs", "sgd", "adam"]   # Categorical choice for solver
    alpha: "(0.0001, 0.1)"             # Range for L2 regularization term
    learning_rate: ["constant", "invscaling", "adaptive"]  # Categorical choice for learning rate schedule
    learning_rate_init: "(0.0001, 0.01)"  # Range for initial learning rate
    max_iter: "(100, 500)"             # Range for the maximum number of iterations

  grid_search_params_grid:
    hidden_layer_sizes: [(50,), (100,), (150,)]
    activation: ["relu", "tanh"]
    solver: ["adam", "sgd"]
    alpha: [0.0001, 0.001, 0.01]
    max_iter: [200, 400, 600]

analyze_strategy_returns:
  strategy_name: "MLP_Classifier"
