prediction_pipeline:
  estimator_name: "k_neighbors_classifier"
  regressor_dict:
    n_neighbors: 8
    weights: "uniform"
    algorithm: "auto"
    leaf_size: 30
    p: 2
    metric: "minkowski"
    metric_params: null
    n_jobs: null

  bayes_search_params_grid:
    n_neighbors: "(3, 15)"         # Range for the number of neighbors to consider
    weights: ["uniform", "distance"]  # Categorical choice for weight function
    leaf_size: "(20, 50)"          # Range for leaf size
    p: "(1, 5)"                    # Range for the power parameter for the Minkowski metric
    algorithm: ["auto", "ball_tree", "kd_tree", "brute"]  # Categorical choice for algorithm
    metric: ["minkowski", "euclidean", "manhattan"]  # Categorical choice for distance metric

  grid_search_params_grid:
    n_neighbors: [3, 5, 7]
    weights: ["uniform", "distance"]
    leaf_size: [30, 40, 50]
    p: [1, 2, 3]

analyze_strategy_returns:
  strategy_name: "KNN_classifier"
